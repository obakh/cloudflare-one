name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/blog/**'
      - 'apps/admin/**'
      - 'packages/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 🔦 Lighthouse Performance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build apps
        run: pnpm build

      - name: 🚀 Start Web App
        run: |
          pnpm --filter @repo/web preview &
          sleep 10
        env:
          PORT: 5173

      - name: 🔦 Run Lighthouse CI - Web
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5173
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: 📊 Performance Summary
        run: |
          echo "## 🔦 Lighthouse Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web App" >> $GITHUB_STEP_SUMMARY
          echo "- Performance, Accessibility, Best Practices, and SEO scores measured" >> $GITHUB_STEP_SUMMARY
          echo "- 3 runs averaged for accuracy" >> $GITHUB_STEP_SUMMARY
          echo "- Full report available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Aim for scores above 90 in all categories" >> $GITHUB_STEP_SUMMARY
